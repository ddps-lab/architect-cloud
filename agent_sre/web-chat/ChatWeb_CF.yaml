AWSTemplateFormatVersion: "2010-09-09"
Description: >
  SRE Incident Copilot — 공유 채팅 웹 (S3 + CloudFront). 루트에서 1회만 배포합니다.
  정적 SPA 한 벌을 모든 수강생이 공유하며, 각자 자신의 에이전트 Function URL을
  화면 설정에 입력해 사용합니다(브라우저 localStorage). 수강생 개별 배포 대상 아님.

Resources:
  ChatBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub copilot-chat-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ChatOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub copilot-chat-oac-${AWS::StackName}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  ChatDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: ChatS3Origin
            DomainName: !GetAtt ChatBucket.RegionalDomainName
            OriginAccessControlId: !Ref ChatOAC
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: ChatS3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html

  ChatBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref ChatBucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${ChatBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${ChatDistribution}

Outputs:
  ChatBucketName:
    Value: !Ref ChatBucket
  ChatSiteUrl:
    Value: !Sub https://${ChatDistribution.DomainName}
