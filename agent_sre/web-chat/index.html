<!DOCTYPE html>
<html lang="ko">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>SRE Incident Copilot</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<header>
			<h1>🛟 SRE Incident Copilot</h1>
			<button id="settings-toggle" class="ghost">⚙︎ 설정</button>
		</header>

		<section id="settings" class="settings hidden">
			<label for="endpoint">에이전트 API 주소 (예: https://xxxx.execute-api.ap-northeast-2.amazonaws.com)</label>
			<div class="row">
				<input id="endpoint" type="text" placeholder="https://...execute-api...amazonaws.com" />
				<button id="save-endpoint">저장</button>
			</div>
			<div class="row">
				<span id="session-label" class="muted"></span>
				<button id="new-session" class="ghost">새 세션</button>
			</div>
			<p id="endpoint-status" class="muted"></p>
		</section>

		<main id="chat" class="chat"></main>

		<form id="composer" class="composer">
			<input id="message" type="text" autocomplete="off" placeholder="예: customer 서비스가 죽었어. 조사해줘." />
			<button id="send" type="submit">전송</button>
		</form>

		<script src="app.js"></script>
	</body>
</html>
