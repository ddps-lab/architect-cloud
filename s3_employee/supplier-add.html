<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="stylesheet" href="bootstrap.min.css" />
		<link rel="stylesheet" href="base.css" />
		<link rel="icon" href="favicon.ico" type="image/x-icon" />
		<link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
		<script src="jquery-3.6.0.min.js"></script>
		<script src="bootstrap.min.js"></script>
		<title>Manage coffee suppliers</title>
		<script>
			$(document).ready(function () {
				$("#nav").load("nav.html");
				$("#supplier-form-fields").load("supplier-form-fields.html");
			});
		</script>
	</head>
	<body>
		<div class="container">
			<div id="nav"></div>
			<div class="mt-2"></div>
			<form id="supplier-form">
				<div id="supplier-form-fields"></div>
				<button id="submit-btn" type="button" class="btn btn-primary" onclick="submitForm()">Submit</button>
			</form>
			<div id="form-alert" class="mt-3" role="alert" style="display: none"></div>
			<script>
				function showAlert(type, message) {
					const el = document.getElementById("form-alert");
					el.className = "mt-3 alert alert-" + type;
					el.textContent = message;
					el.style.display = "block";
				}
				function submitForm() {
					const form = document.getElementById("supplier-form");
					const nameInput = document.getElementById("name");
					const addressInput = document.getElementById("address");
					const cityInput = document.getElementById("city");
					const stateInput = document.getElementById("state");
					const emailInput = document.getElementById("email");
					const phoneInput = document.getElementById("phone");
					if (
						!nameInput.value ||
						!addressInput.value ||
						!cityInput.value ||
						!stateInput.value ||
						!emailInput.value ||
						!phoneInput.value
					) {
						showAlert("warning", "All fields are required");
						return;
					}
					const formData = new FormData(form);
					const urlEncodedData = new URLSearchParams(formData).toString();

					showAlert("info", "Submitting…");

					fetch("YOUR_API_URL/api/v1/supplier-add", {
						method: "POST",
						headers: {
							"Content-Type": "application/x-www-form-urlencoded",
						},
						body: urlEncodedData,
					})
						.then(async (response) => {
							const raw = await response.text();
							if (!response.ok) {
								throw new Error("HTTP " + response.status + " — " + (raw || response.statusText));
							}
							return raw ? JSON.parse(raw) : {};
						})
						.then((data) => {
							console.log("Success:", data);
							showAlert("success", "Supplier added. Redirecting…");
							setTimeout(() => (window.location.href = "./supplier-list-all.html"), 800);
						})
						.catch((error) => {
							console.error("Error:", error);
							showAlert("danger", "공급자 추가 실패: " + error.message);
						});
				}
			</script>
		</div>
	</body>
</html>
