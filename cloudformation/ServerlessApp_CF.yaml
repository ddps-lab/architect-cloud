AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Serverless coffee-supplier app. Provisions VPC, RDS MySQL, two Lambda
  microservices (customer / employee) inside the VPC, an HTTP API Gateway,
  and S3 + CloudFront for the two static frontends.

Parameters:
  CodeBucket:
    Type: String
    Default: samsung-cloud-architect
    Description: 패키지된 Lambda zip 이 있는 버킷 (강사 공유 버킷 — 미리 만들 필요 없음)
  CustomerCodeKey:
    Type: String
    Default: coffee/customer.zip
    Description: S3 key of the customer Lambda package
  EmployeeCodeKey:
    Type: String
    Default: coffee/employee.zip
    Description: S3 key of the employee Lambda package
  ArtifactsBucket:
    Type: String
    Default: samsung-cloud-architect
    Description: 프론트엔드 소스(frontend/customer, frontend/employee)가 있는 공유 버킷
  FrontendPrefix:
    Type: String
    Default: frontend
    Description: 공유 버킷 내 프론트엔드 소스 prefix
  DBUsername:
    Type: String
    Default: nodeapp
  DBPassword:
    Type: String
    Default: lab-password
    NoEcho: true
  DBName:
    Type: String
    Default: COFFEE

Resources:
  ###########
  # VPC
  ###########
  LabVPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.16.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags:
        - Key: Name
          Value: LabVPC

  IGW:
    Type: AWS::EC2::InternetGateway
    DependsOn: LabVPC
    Properties:
      Tags:
        - Key: Name
          Value: LabIGW

  AttachGateway:
    Type: AWS::EC2::VPCGatewayAttachment
    DependsOn:
      - LabVPC
      - IGW
    Properties:
      VpcId: !Ref LabVPC
      InternetGatewayId: !Ref IGW

  ###########
  # Public Subnets
  ###########
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref LabVPC
      AvailabilityZone: !Select [0, !GetAZs ""]
      CidrBlock: 10.16.10.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: Public Subnet1

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref LabVPC
      AvailabilityZone: !Select [1, !GetAZs ""]
      CidrBlock: 10.16.20.0/24
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: Public Subnet2

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    DependsOn:
      - LabVPC
      - AttachGateway
    Properties:
      VpcId: !Ref LabVPC
      Tags:
        - Key: Name
          Value: Public Route Table

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn:
      - PublicRouteTable
      - AttachGateway
    Properties:
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref IGW
      RouteTableId: !Ref PublicRouteTable

  PublicSubnetRouteAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet1

  PublicSubnetRouteAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PublicRouteTable
      SubnetId: !Ref PublicSubnet2

  ###########
  # Private Subnets (Lambda + RDS)
  ###########
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    DependsOn: LabVPC
    Properties:
      VpcId: !Ref LabVPC
      CidrBlock: 10.16.30.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: Private Subnet 1

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    DependsOn: LabVPC
    Properties:
      VpcId: !Ref LabVPC
      CidrBlock: 10.16.40.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: Private Subnet 2

  PrivateRouteTable1:
    Type: AWS::EC2::RouteTable
    DependsOn: LabVPC
    Properties:
      VpcId: !Ref LabVPC
      Tags:
        - Key: Name
          Value: Private Route Table 1

  PrivateRouteTable2:
    Type: AWS::EC2::RouteTable
    DependsOn: LabVPC
    Properties:
      VpcId: !Ref LabVPC
      Tags:
        - Key: Name
          Value: Private Route Table 2

  PrivateRouteTableAssociation1:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable1
      SubnetId: !Ref PrivateSubnet1

  PrivateRouteTableAssociation2:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      RouteTableId: !Ref PrivateRouteTable2
      SubnetId: !Ref PrivateSubnet2

  ###########
  # Security Groups
  ###########
  LambdaSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Lambda functions ENI security group
      VpcId: !Ref LabVPC
      SecurityGroupEgress:
        - IpProtocol: -1
          CidrIp: 0.0.0.0/0
      Tags:
        - Key: Name
          Value: LambdaSG

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS MySQL security group (only Lambda may connect)
      VpcId: !Ref LabVPC
      Tags:
        - Key: Name
          Value: DBSG

  # Allow MySQL only from the Lambda SG (kept as a separate resource to avoid a circular dependency)
  DBIngressFromLambda:
    Type: AWS::EC2::SecurityGroupIngress
    Properties:
      GroupId: !Ref DBSecurityGroup
      IpProtocol: tcp
      FromPort: 3306
      ToPort: 3306
      SourceSecurityGroupId: !Ref LambdaSecurityGroup

  ###########
  # RDS Database (private)
  ###########
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private subnet group for RDS
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2

  MyDBInstance:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Delete
    DependsOn: AttachGateway
    Properties:
      DBInstanceIdentifier: supplierdb
      DBInstanceClass: db.t3.micro
      Engine: mysql
      EngineVersion: "8.0.42"
      MasterUsername: !Ref DBUsername
      MasterUserPassword: !Ref DBPassword
      DBName: !Ref DBName
      DBSubnetGroupName: !Ref DBSubnetGroup
      MultiAZ: false
      AllocatedStorage: 20
      MaxAllocatedStorage: 1000
      StorageType: gp2
      StorageEncrypted: true
      PubliclyAccessible: false
      VPCSecurityGroups:
        - !Ref DBSecurityGroup
      Tags:
        - Key: Name
          Value: MyDatabaseInstance

  ###########
  # Lambda
  ###########
  LambdaExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

  CustomerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: coffee-customer
      Runtime: nodejs22.x
      Handler: index.handler
      Timeout: 30
      MemorySize: 256
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref CustomerCodeKey
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2
      Environment:
        Variables:
          APP_DB_HOST: !GetAtt MyDBInstance.Endpoint.Address
          APP_DB_USER: !Ref DBUsername
          APP_DB_PASSWORD: !Ref DBPassword
          APP_DB_NAME: !Ref DBName

  EmployeeFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: coffee-employee
      Runtime: nodejs22.x
      Handler: index.handler
      Timeout: 30
      MemorySize: 256
      Role: !GetAtt LambdaExecutionRole.Arn
      Code:
        S3Bucket: !Ref CodeBucket
        S3Key: !Ref EmployeeCodeKey
      VpcConfig:
        SecurityGroupIds:
          - !Ref LambdaSecurityGroup
        SubnetIds:
          - !Ref PrivateSubnet1
          - !Ref PrivateSubnet2
      Environment:
        Variables:
          APP_DB_HOST: !GetAtt MyDBInstance.Endpoint.Address
          APP_DB_USER: !Ref DBUsername
          APP_DB_PASSWORD: !Ref DBPassword
          APP_DB_NAME: !Ref DBName

  ###########
  # API Gateway (HTTP API) - customer
  ###########
  CustomerApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: coffee-customer-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - "*"
        AllowHeaders:
          - "*"

  CustomerIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref CustomerApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt CustomerFunction.Arn
      PayloadFormatVersion: "2.0"

  CustomerRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref CustomerApi
      RouteKey: $default
      Target: !Sub integrations/${CustomerIntegration}

  CustomerStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref CustomerApi
      StageName: $default
      AutoDeploy: true

  CustomerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref CustomerFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${CustomerApi}/*/*

  ###########
  # API Gateway (HTTP API) - employee
  ###########
  EmployeeApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: coffee-employee-api
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - "*"
        AllowMethods:
          - "*"
        AllowHeaders:
          - "*"

  EmployeeIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref EmployeeApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt EmployeeFunction.Arn
      PayloadFormatVersion: "2.0"

  EmployeeRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref EmployeeApi
      RouteKey: $default
      Target: !Sub integrations/${EmployeeIntegration}

  EmployeeStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref EmployeeApi
      StageName: $default
      AutoDeploy: true

  EmployeeInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref EmployeeFunction
      Action: lambda:InvokeFunction
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${EmployeeApi}/*/*

  ###########
  # S3 + CloudFront - frontends
  ###########
  CustomerBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub coffee-customer-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  EmployeeBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub coffee-employee-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub coffee-frontend-oac-${AWS::StackName}
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CustomerDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: home.html
        Origins:
          - Id: CustomerS3Origin
            DomainName: !GetAtt CustomerBucket.RegionalDomainName
            OriginAccessControlId: !Ref FrontendOAC
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: CustomerS3Origin
          ViewerProtocolPolicy: redirect-to-https
          # AWS managed "CachingOptimized" cache policy
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html

  EmployeeDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: home.html
        Origins:
          - Id: EmployeeS3Origin
            DomainName: !GetAtt EmployeeBucket.RegionalDomainName
            OriginAccessControlId: !Ref FrontendOAC
            S3OriginConfig:
              OriginAccessIdentity: ""
        DefaultCacheBehavior:
          TargetOriginId: EmployeeS3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
        CustomErrorResponses:
          - ErrorCode: 403
            ResponseCode: 404
            ResponsePagePath: /404.html
          - ErrorCode: 404
            ResponseCode: 404
            ResponsePagePath: /404.html

  CustomerBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CustomerBucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${CustomerBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${CustomerDistribution}

  EmployeeBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref EmployeeBucket
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          - Sid: AllowCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub ${EmployeeBucket.Arn}/*
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:aws:cloudfront::${AWS::AccountId}:distribution/${EmployeeDistribution}

  ###########
  # 프론트엔드 자동 발행 (custom resource)
  #  - 생성/업데이트: 공유 버킷의 프론트 소스를 받아 YOUR_API_URL 을 이 스택의
  #    API GW 주소로 치환해 프론트 버킷에 업로드 + CloudFront 무효화
  #  - 삭제: 프론트 버킷 비우기 (버킷이 안 비어 DeleteStack 실패하는 문제 방지)
  ###########
  FrontendManagerPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          # 프론트 소스 읽기 (공유 버킷)
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:ListBucket
            Resource:
              - !Sub arn:aws:s3:::${ArtifactsBucket}
              - !Sub arn:aws:s3:::${ArtifactsBucket}/*
          # 프론트 버킷 쓰기/비우기
          - Effect: Allow
            Action:
              - s3:ListBucket
              - s3:ListBucketVersions
            Resource:
              - !GetAtt CustomerBucket.Arn
              - !GetAtt EmployeeBucket.Arn
          - Effect: Allow
            Action:
              - s3:PutObject
              - s3:DeleteObject
              - s3:DeleteObjectVersion
            Resource:
              - !Sub ${CustomerBucket.Arn}/*
              - !Sub ${EmployeeBucket.Arn}/*
          # CloudFront 무효화
          - Effect: Allow
            Action: cloudfront:CreateInvalidation
            Resource: "*"

  FrontendManagerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Ref FrontendManagerPolicy

  FrontendManagerFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-frontend-manager
      Runtime: python3.13
      Handler: index.handler
      Timeout: 300
      MemorySize: 256
      Role: !GetAtt FrontendManagerRole.Arn
      Code:
        ZipFile: |
          import json, boto3
          from urllib.request import Request, urlopen

          s3 = boto3.client("s3")
          cf = boto3.client("cloudfront")

          CT = {".html":"text/html",".css":"text/css",".js":"application/javascript",
                ".json":"application/json",".map":"application/json",".jpg":"image/jpeg",
                ".jpeg":"image/jpeg",".png":"image/png",".ico":"image/x-icon",
                ".svg":"image/svg+xml",".woff":"font/woff",".woff2":"font/woff2"}

          def ctype(key):
              k = key.lower()
              for ext, t in CT.items():
                  if k.endswith(ext):
                      return t
              return "binary/octet-stream"

          def send(event, context, status, reason=""):
              body = json.dumps({
                  "Status": status,
                  "Reason": reason or "see CloudWatch " + context.log_stream_name,
                  "PhysicalResourceId": event.get("PhysicalResourceId", event["LogicalResourceId"]),
                  "StackId": event["StackId"], "RequestId": event["RequestId"],
                  "LogicalResourceId": event["LogicalResourceId"], "Data": {},
              }).encode()
              urlopen(Request(event["ResponseURL"], data=body, method="PUT",
                              headers={"content-type": "", "content-length": str(len(body))}))

          def publish(p):
              src, dst, api = p["SourceBucket"], p["TargetBucket"], p["ApiUrl"]
              prefix = p["SourcePrefix"].rstrip("/") + "/"
              for page in s3.get_paginator("list_objects_v2").paginate(Bucket=src, Prefix=prefix):
                  for obj in page.get("Contents", []):
                      key = obj["Key"]
                      rel = key[len(prefix):]
                      if not rel:
                          continue
                      data = s3.get_object(Bucket=src, Key=key)["Body"].read()
                      if key.lower().endswith(".html"):
                          data = data.replace(b"YOUR_API_URL", api.encode())
                      s3.put_object(Bucket=dst, Key=rel, Body=data, ContentType=ctype(key))

          def handler(event, context):
              rt = event["RequestType"]
              try:
                  p = event["ResourceProperties"]
                  if rt == "Delete":
                      boto3.resource("s3").Bucket(p["TargetBucket"]).object_versions.delete()
                  else:
                      publish(p)
                      dist = p.get("DistributionId")
                      if dist:
                          try:
                              cf.create_invalidation(DistributionId=dist, InvalidationBatch={
                                  "Paths": {"Quantity": 1, "Items": ["/*"]},
                                  "CallerReference": event["RequestId"]})
                          except Exception as e:
                              print("invalidation skipped:", e)
                  send(event, context, "SUCCESS")
              except Exception as e:
                  print("error:", e)
                  # 삭제는 막지 않도록 SUCCESS, 생성/업데이트 실패는 FAILED 로 알림
                  send(event, context, "SUCCESS" if rt == "Delete" else "FAILED", reason=str(e))

  CustomerFrontend:
    Type: Custom::Frontend
    DependsOn: CustomerBucketPolicy
    Properties:
      ServiceToken: !GetAtt FrontendManagerFunction.Arn
      SourceBucket: !Ref ArtifactsBucket
      SourcePrefix: !Sub ${FrontendPrefix}/customer
      TargetBucket: !Ref CustomerBucket
      ApiUrl: !GetAtt CustomerApi.ApiEndpoint
      DistributionId: !Ref CustomerDistribution

  EmployeeFrontend:
    Type: Custom::Frontend
    DependsOn: EmployeeBucketPolicy
    Properties:
      ServiceToken: !GetAtt FrontendManagerFunction.Arn
      SourceBucket: !Ref ArtifactsBucket
      SourcePrefix: !Sub ${FrontendPrefix}/employee
      TargetBucket: !Ref EmployeeBucket
      ApiUrl: !GetAtt EmployeeApi.ApiEndpoint
      DistributionId: !Ref EmployeeDistribution

Outputs:
  DBInstanceEndpoint:
    Description: RDS MySQL endpoint
    Value: !GetAtt MyDBInstance.Endpoint.Address
    Export:
      Name: !Sub ${AWS::StackName}-DBInstanceEndpoint
  PrivateSubnet1Id:
    Description: Private subnet 1 (for in-VPC Lambdas like the fault injector)
    Value: !Ref PrivateSubnet1
    Export:
      Name: !Sub ${AWS::StackName}-PrivateSubnet1
  PrivateSubnet2Id:
    Description: Private subnet 2
    Value: !Ref PrivateSubnet2
    Export:
      Name: !Sub ${AWS::StackName}-PrivateSubnet2
  LambdaSecurityGroupId:
    Description: Lambda SG (already allowed into the RDS SG)
    Value: !Ref LambdaSecurityGroup
    Export:
      Name: !Sub ${AWS::StackName}-LambdaSecurityGroup
  CustomerApiUrl:
    Description: Customer API base URL (use as YOUR_API_URL for s3_customer)
    Value: !GetAtt CustomerApi.ApiEndpoint
  EmployeeApiUrl:
    Description: Employee API base URL (use as YOUR_API_URL for s3_employee)
    Value: !GetAtt EmployeeApi.ApiEndpoint
  CustomerBucketName:
    Description: S3 bucket for the customer frontend
    Value: !Ref CustomerBucket
  EmployeeBucketName:
    Description: S3 bucket for the employee frontend
    Value: !Ref EmployeeBucket
  CustomerSiteUrl:
    Description: CloudFront URL for the customer frontend
    Value: !Sub https://${CustomerDistribution.DomainName}
  EmployeeSiteUrl:
    Description: CloudFront URL for the employee frontend
    Value: !Sub https://${EmployeeDistribution.DomainName}
