AWSTemplateFormatVersion: 2010-09-09
Description: >
  SRE Incident Copilot — LAB BASE

Parameters:
  CoffeeStackName:
    Type: String
    Default: coffee-serverless
    Description: VPC/RDS 를 만든 coffee 스택 이름 (서브넷·SG·DB엔드포인트를 Export 에서 가져옴)
  DbUser:
    Type: String
    Default: nodeapp
  DbPassword:
    Type: String
    NoEcho: true
    Default: lab-password
  DbName:
    Type: String
    Default: COFFEE
  ArtifactsBucket:
    Type: String
    Default: samsung-cloud-architect
    Description: 공유 산출물(injector.zip / layer.zip / 깨끗한 coffee zip)이 있는 버킷
  InjectorCodeKey:
    Type: String
    Default: copilot/injector.zip

Resources:
  ###########
  # 세션(기억) 버킷 — 에이전트 S3SessionManager 용
  ###########
  SessionBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub copilot-sessions-${AWS::AccountId}-${AWS::Region}
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  ###########
  # 장애 주입 Lambda (Node, VPC) — 자기 환경의 RDS에 SQL 실행
  ###########
  InjectorRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole

  InjectorFunction:
    Type: AWS::Lambda::Function
    Properties:
      FunctionName: coffee-fault-injector
      Runtime: nodejs22.x
      Handler: index.handler
      Timeout: 30
      MemorySize: 256
      Role: !GetAtt InjectorRole.Arn
      Code:
        S3Bucket: !Ref ArtifactsBucket
        S3Key: !Ref InjectorCodeKey
      VpcConfig:
        SecurityGroupIds:
          - Fn::ImportValue: !Sub ${CoffeeStackName}-LambdaSecurityGroup
        SubnetIds:
          - Fn::ImportValue: !Sub ${CoffeeStackName}-PrivateSubnet1
          - Fn::ImportValue: !Sub ${CoffeeStackName}-PrivateSubnet2
      Environment:
        Variables:
          APP_DB_HOST:
            Fn::ImportValue: !Sub ${CoffeeStackName}-DBInstanceEndpoint
          APP_DB_USER: !Ref DbUser
          APP_DB_PASSWORD: !Ref DbPassword
          APP_DB_NAME: !Ref DbName

  ###########
  # 에이전트 권한 (관리형 정책) — 인라인 Policies 대신 별도 ManagedPolicy 로 분리
  ###########
  AgentManagedPolicy:
    Type: AWS::IAM::ManagedPolicy
    Properties:
      ManagedPolicyName: !Sub agent-base-policy-${AWS::Region}
      PolicyDocument:
        Version: 2012-10-17
        Statement:
          # Bedrock 모델 호출 + KB 검색 (KB는 학생이 만드므로 Resource * — 랩 한정)
          - Effect: Allow
            Action:
              - bedrock:InvokeModel
              - bedrock:InvokeModelWithResponseStream
              - bedrock:Retrieve
            Resource: "*"
          # 진단: coffee 서비스 로그 읽기
          - Effect: Allow
            Action:
              - logs:FilterLogEvents
              - logs:GetLogEvents
              - logs:DescribeLogStreams
            Resource: !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/coffee-*
          # 복구: injector 호출 + coffee 함수 재배포
          - Effect: Allow
            Action: lambda:InvokeFunction
            Resource: !GetAtt InjectorFunction.Arn
          - Effect: Allow
            Action:
              - lambda:UpdateFunctionCode
              - lambda:GetFunction
              - lambda:GetFunctionConfiguration
            Resource:
              - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:coffee-customer
              - !Sub arn:aws:lambda:${AWS::Region}:${AWS::AccountId}:function:coffee-employee
          - Effect: Allow
            Action: s3:GetObject
            Resource: !Sub arn:aws:s3:::${ArtifactsBucket}/*
          # 기억: 세션 버킷
          - Effect: Allow
            Action:
              - s3:GetObject
              - s3:PutObject
              - s3:DeleteObject
              - s3:ListBucket
            Resource:
              - !GetAtt SessionBucket.Arn
              - !Sub ${SessionBucket.Arn}/*

  ###########
  # 에이전트 IAM 역할 — 학생이 만든 에이전트 Lambda 에 붙입니다
  ###########
  AgentRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub agent-base-role-${AWS::Region}
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
        - !Ref AgentManagedPolicy

Outputs:
  AgentRoleArn:
    Description: 학생 에이전트 Lambda 에 붙일 실행 역할
    Value: !GetAtt AgentRole.Arn
  SessionBucketName:
    Description: 에이전트 env SESSION_BUCKET 값
    Value: !Ref SessionBucket
  InjectorFunctionName:
    Description: 에이전트 env INJECTOR_FN 값 / faults 스크립트 대상
    Value: !Ref InjectorFunction
  LwaLayerArn:
    Description: 에이전트 Lambda 에 추가할 Lambda Web Adapter 레이어
    Value: !Sub arn:aws:lambda:${AWS::Region}:753240598075:layer:LambdaAdapterLayerX86:28
